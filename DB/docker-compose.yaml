services:
  db:
    image: postgres:16
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pg_data_new:/var/lib/postgresql/data
    networks:
      - practice_1_default

volumes:
  pg_data_new:

networks:
  practice_1_default: